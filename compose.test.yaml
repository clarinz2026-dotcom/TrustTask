services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trusttask
      POSTGRES_PASSWORD: trusttask_local_only
      POSTGRES_DB: trusttask_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusttask -d trusttask_test"]
      interval: 2s
      timeout: 3s
      retries: 30
