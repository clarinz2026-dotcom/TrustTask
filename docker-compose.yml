services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trusttask
      POSTGRES_PASSWORD: trusttask_local_only
      POSTGRES_DB: trusttask
    ports:
      - "5432:5432"
    volumes:
      - trusttask-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusttask -d trusttask"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://trusttask:trusttask_local_only@db:5432/trusttask
      SESSION_SECRET: local-only-trusttask-session-secret-change-before-deployment
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  trusttask-postgres:
